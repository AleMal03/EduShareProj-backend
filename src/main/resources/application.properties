#Server props
spring.application.name=ServerEduShare
server.port=7777

#DB props
spring.datasource.url=jdbc:postgresql://localhost:5432/EduShareDB
spring.datasource.username=EduShareAdmin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Session props
server.servlet.session.timeout=10m
spring.session.timeout=10m
spring.session.jdbc.initialize-schema=always
server.servlet.session.cookie.name=EDUSHARE_SESSION_COOKIE
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
